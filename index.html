        <button id="openModal" type="button"

          <span id="filterSpn" style="display: flex; column-gap: 1rem;">
            <select name="PriorityFilter" id="PriorityFilter"  class="h-10 bg-[#39393D]  p-2 rounded-md w-40 border border-white/75" style="text-align: center;">
              <option value="" selected disabled>Priorities</option>
            </select>
            
            <select name="MembersFilter" id="membersFilter"  class="h-10 bg-[#39393D]  p-2 rounded-md w-40 border border-white/75" style="text-align: center;">
              <option value="" selected disabled>Members</option>
            </select>
          </span>
          <img id="uiFilter" src="./assets/filter.svg" class="h-10  p-2 rounded-md border border-white/75"
            alt="filter icon">

      </fieldset>
      <!-- create modal -->
      <section id="ticketModal" class="modalWrapper">

      <div id="BoardsContainer" class="grid grid-cols-3 gap-5">

        <!-- TODO -->
        <div id="todo" class="boards  p-3 bg-[#18181B] border border-[#27272A] rounded-xl grid  gap-2">
          <label>
            <!-- named StatusSelection  in js  -->
            <select id="todoSelection" name="todoSelection" style="appearance: none; color: rgb(176, 154, 154);"
              class="bg-[#202023]  p-2 w-full rounded-md border border-white/75">
              <option value="" selected disabled>Select Todo ... 　　　　　　　　　　　　▼</option>
              <!-- <option value=""></option> create them in js -->
            </select>
          </label>
          <h4>To Do</h4>
          <!-- named statusBoardWrapper  in js  -->
          <article id="todoElementsWrapper" class="flex flex-col gap-3 p-2 bg-[#202023] rounded-sm">

          </article>
          <button id="add" type="button" class="modalBtn bg-[#202023]  rounded-md w-full">+</button>

        <!-- IN PROGRESS -->
        <div class="boards  p-3 bg-[#18181B] border border-[#27272A] rounded-xl grid  gap-2">

            <select id="inProgressSelection" name="inProgress" style="appearance: none; color: rgb(176, 154, 154);"
